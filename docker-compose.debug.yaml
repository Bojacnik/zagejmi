services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: zagejmi.mailpit-container
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - zagejmi_network

  zagejmi:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgredb;Port=5432;Database=my_postgres_db;Username=my_postgre_user;Password=my_strong_password
      EmailVerification__PublicBaseUrl: http://localhost:5271
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: false
      Smtp__UseAuthentication: false
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__FromEmail: no-reply@zagejmi.cz
      Smtp__FromName: Zagejmi
    depends_on:
      postgredb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - zagejmi_network

