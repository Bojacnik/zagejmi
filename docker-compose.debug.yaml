services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: zagejmi.mailpit-container
    # Host ports 1026/8026 so this doesn't clash with other local Mailpit instances on 1025/8025.
    # Containers still use mailpit:1025. Web UI: http://localhost:8026
    ports:
      - "1026:1025"
      - "8026:8025"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - zagejmi_network

  zagejmi.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      EmailVerification__PublicBaseUrl: http://localhost:5178
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__EnableSsl: false
      Smtp__UseAuthentication: false
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__FromEmail: no-reply@zagejmi.cz
      Smtp__FromName: Zagejmi
    depends_on:
      postgresdb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - zagejmi_network

