# Production stack on the Hetzner server (lives in /opt/zagejmi next to .env).
# The deploy workflow (.github/workflows/deploy.yml) copies this file over and runs
#   IMAGE_TAG=<commit sha> docker compose up -d
# HTTPS is done by the Caddy installed on the server itself (systemd, /etc/caddy/Caddyfile), which also serves other
# sites; it proxies zagejmi.cz to 127.0.0.1:3000. Nothing here is reachable from outside: the app listens on loopback
# only, PostgreSQL and MinIO only on the internal network. The optional mail server (profile "mail") is the exception: it
# publishes the mail ports 25, 465, 587 and 993.
# Secrets come from .env on the server (template: deploy/.env.example), never from the repository.
name: zagejmi

services:
  api:
    image: ghcr.io/bojacnik/zagejmi:${IMAGE_TAG:-production}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080" # host Caddy → app; loopback only
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Trust X-Forwarded-For/-Proto from the host Caddy, so the app sees https and the real client IP.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__MigrateOnStartup: "true"
      # Don't log every SQL statement in production (failed commands are still logged as errors).
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=zagejmi;Username=zagejmi;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      Minio__UseSsl: "false"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Auth__Secrets__Zagejmi__Pepper: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER in .env}
      Api__BaseUrl: http://localhost:8080/
      Cors__AllowedOrigins__0: https://${DOMAIN}
      EmailVerification__PublicBaseUrl: https://${DOMAIN}
      # Where mail goes out: an SMTP relay (Brevo) or our own mail server (the "mail" service below, reached inside the
      # zagejmi network under MAIL_HOSTNAME). Switch between them with deploy/mail/switch-smtp.sh.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      # Auto (by port: 465 = implicit TLS, otherwise STARTTLS), StartTls, SslOnConnect or None.
      Smtp__Security: ${SMTP_SECURITY:-Auto}
      Smtp__UseAuthentication: ${SMTP_USE_AUTHENTICATION:-true}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-no-reply@zagejmi.cz}
      Smtp__FromName: ${SMTP_FROM_NAME:-Zagejmi}
      # Admin who resolves reported orders on /admin/orders (a verified account with this e-mail). Empty = nobody.
      Admin__Emails__0: ${ADMIN_EMAIL:-}
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys # keeps users signed in across deploys
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - zagejmi

  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: zagejmi
      POSTGRES_USER: zagejmi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zagejmi -d zagejmi" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    networks:
      - zagejmi

  minio:
    # Official minio/minio images are no longer published (Docker Hub repo removed); pgsty/minio is the maintained
    # community build of the same server, multi-arch (the Hetzner server is ARM64).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: [ "server", "/data" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - zagejmi

  mail:
    # Our own mail server for @zagejmi.cz (Stalwart: SMTP, IMAP, DKIM, spam filter, web admin). Off until .env has
    # COMPOSE_PROFILES=mail; deploy/mail/setup-mail.sh turns it on and configures it, deploy/MAIL.md is the runbook.
    # It owns the mail ports on the server directly (no Caddy in between, so it sees the real client IPs); its web part
    # (admin, MTA-STS, autoconfig) goes through the host Caddy on 127.0.0.1:8090. The TLS certificate is Caddy's,
    # copied into ./mail-tls by deploy/mail/sync-cert.sh.
    image: stalwartlabs/stalwart:v1.0.3
    profiles: [ "mail" ]
    restart: unless-stopped
    init: true
    environment:
      # "admin:<password>": a fixed administrator for setup-mail.sh, the cert reload and the web admin. Optional here
      # (compose checks variables even for services that are off); empty = no such administrator.
      STALWART_RECOVERY_ADMIN: ${MAIL_ADMIN:-}
      # Its public address behind Caddy, for redirects and links (otherwise they point to 127.0.0.1:8080).
      STALWART_PUBLIC_URL: https://${MAIL_HOSTNAME:-mx.zagejmi.cz}
    ports:
      - "25:25"     # incoming mail from other servers
      - "465:465"   # sending from mail clients and the app (implicit TLS)
      - "587:587"   # sending from mail clients (STARTTLS)
      - "993:993"   # IMAP for mail clients
      - "127.0.0.1:8090:8080" # host Caddy → web admin, MTA-STS, autoconfig; loopback only
    volumes:
      - mail_config:/etc/stalwart
      - mail_data:/var/lib/stalwart
      - ./mail-tls:/etc/stalwart/tls:ro
    logging: *logging
    networks:
      zagejmi:
        # The app reaches the mail server by its public name without leaving the server, so its TLS certificate fits.
        aliases:
          - ${MAIL_HOSTNAME:-mx.zagejmi.cz}

volumes:
  mail_config:
  mail_data:
  dataprotection_keys:
  postgres_data:
  minio_data:

networks:
  zagejmi:
