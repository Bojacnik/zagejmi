networks:
  zagejmi_network:
    driver: bridge

services:
  postgresdb:
    image: postgres:18.4-alpine3.24
    
    container_name: my_postgresdb_instance
    
    environment:
      POSTGRES_DB: my_postgres_db
      POSTGRES_USER: my_postgres_user
      POSTGRES_PASSWORD: my_strong_password
      POSTGRES_SHARED_BUFFERS: 512MB
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgresdb_data:/var/lib/postgresql
      - postgresdb_logs:/var/log/postgresql
    
    restart: unless-stopped
    
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    networks:
      - zagejmi_network
  
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    
    container_name: zagejmi.minio
    
    environment:
      # Replace these defaults with strong credentials via env or .env in production
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    
    # The image's default entrypoint is the minio binary, so run the shell explicitly.
    entrypoint: [ "sh", "-c" ]
    command: [ "mkdir -p /var/log/minio && exec minio server /data --console-address :9001 >> /var/log/minio/minio.log 2>&1" ]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
      - minio_logs:/var/log/minio
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - zagejmi_network

  zagejmi.api:
    image: zagejmi.api
    build:
      context: .
      dockerfile: src/Zagejmi.Api/Dockerfile

    ports:
      - "5178:8080"

    environment:
      ConnectionStrings__DefaultConnection: Host=postgresdb;Port=5432;Database=my_postgres_db;Username=my_postgres_user;Password=my_strong_password
      Minio__Endpoint: minio:9000

    volumes:
      - api_dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    
    networks:
      - zagejmi_network
    
    depends_on:
      postgresdb:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgresdb_data:
  postgresdb_logs:
  minio_data:
  minio_logs:
  api_dataprotection_keys: