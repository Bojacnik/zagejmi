# Deploys to the Hetzner server on every push to the production branch: tests → Docker image → server.
#
#   Release:   merge master into production (PR master → production, or `git push origin master:production`).
#   Rollback:  Actions → Deploy → Run workflow, put an older commit SHA into "image_tag" (skips tests and build), or
#              revert the commit on production.
#   Redeploy:  Actions → Deploy → Run workflow with an empty "image_tag" (rebuilds the production branch).
#
# Needs the "production" environment (Settings → Environments) with these secrets; see deploy/README.md:
#   DEPLOY_HOST          server IP or host name
#   DEPLOY_USER          SSH user on the server (deploy)
#   DEPLOY_SSH_KEY       private key whose public half is in the server's authorized_keys
#   DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan <server-ip>`, so the runner can verify the server
#
# A commit with [skip tests] on production is not deployed: the deploy needs passing tests.
name: Deploy

on:
  push:
    branches: [ production ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an already built image (commit SHA) instead of building; leave empty to build"
        required: false
        default: ""

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/bojacnik/zagejmi

jobs:
  test:
    name: Tests
    if: inputs.image_tag == ''
    uses: ./.github/workflows/tests.yml

  build:
    name: Build image
    needs: test
    # The server is an ARM64 Hetzner CAX machine; build natively on GitHub's ARM runner (free for public repos).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Zagejmi.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:production
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    needs: build
    # Runs after a build, or on its own when an existing image_tag is given (test and build are skipped then).
    if: >-
      always() &&
      (needs.build.result == 'success' || (inputs.image_tag != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://zagejmi.cz
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check image tag
        run: |
          # Images are tagged with the full commit SHA; anything else is a typo (and must not reach the remote shell).
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-character commit SHA"; exit 1; }

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Copy compose file
        run: scp -o BatchMode=yes deploy/compose.yaml "$SSH_TARGET:/opt/zagejmi/"

      - name: Pull and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes over stdin, so it never shows up in the server's process list; it expires with this job.
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$SSH_TARGET" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -o BatchMode=yes "$SSH_TARGET" "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/zagejmi
          test -f .env || { echo "::error::/opt/zagejmi/.env is missing, see deploy/README.md"; exit 1; }
          trap 'docker logout ghcr.io > /dev/null' EXIT
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          # Remember the running version for manual `docker compose` commands on the server.
          echo "$IMAGE_TAG" > .deployed-tag
          REMOTE

      - name: Wait until healthy
        run: |
          ssh -o BatchMode=yes "$SSH_TARGET" bash -s <<'REMOTE'
          set -uo pipefail
          cd /opt/zagejmi
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/healthz 2> /dev/null | grep -q Healthy; then
              echo "Healthy after ${i} tries."
              docker image prune -af --filter "until=168h" > /dev/null || true
              exit 0
            fi
            sleep 3
          done
          echo "::error::The app did not become healthy within 3 minutes. Last log lines:"
          docker compose logs --tail 80 api
          exit 1
          REMOTE
